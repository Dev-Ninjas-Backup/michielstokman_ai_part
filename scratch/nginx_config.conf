server {
    server_name transformtoliberation.com www.transformtoliberation.com;

    # 1. Next.js Frontend (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/transformtoliberation.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/transformtoliberation.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name api.transformtoliberation.com;

    # FastAPI Backend (port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Increase upload size for audio/media files
    client_max_body_size 100M;
}

server {
    if ($host = www.transformtoliberation.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = transformtoliberation.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name transformtoliberation.com www.transformtoliberation.com;
    return 404; # managed by Certbot
}
