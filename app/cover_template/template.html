<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TTL cover template preview</title>
  <style>
    @font-face {
      font-family: "Edo";
      src: url("fonts/edo.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: "Outfit";
      src: url("fonts/Outfit-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2160px;
      height: 2160px;
      overflow: hidden;
      background: #f1ede4;
    }
    .card {
      position: relative;
      width: 2160px;
      height: 2160px;
      overflow: hidden;
      background: #f1ede4;
    }
    .font-edo {
      font-family: "Edo", cursive, sans-serif;
      font-style: normal;
      font-weight: normal;
    }
    .title-block {
      position: absolute;
      left: 92px;
      top: 271px;
      width: 1253px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      z-index: 4;
    }
    .title {
      color: #37178c;
      font-size: 154px;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .subtitle {
      color: #eb2874;
      font-size: 80px;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .description {
      position: absolute;
      left: 92px;
      top: 1002px;
      width: 663px;
      color: #301c05;
      font-family: "Outfit", sans-serif;
      font-weight: 500;
      font-size: 70px;
      line-height: 1.5;
      z-index: 4;
    }
    .location {
      position: absolute;
      left: 92px;
      top: 1417px;
      display: flex;
      align-items: center;
      gap: 48px;
      z-index: 4;
    }
    .location-pin {
      width: 104px;
      height: 140px;
      object-fit: contain;
    }
    .location-text {
      width: 428px;
      color: #000;
      font-size: 60px;
      line-height: 1.2;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .ttl-logo {
      position: absolute;
      left: 92px;
      top: 12px;
      width: 199px;
      height: 229px;
      object-fit: contain;
      z-index: 5;
    }
    .sun {
      position: absolute;
      left: 1922px;
      top: 32px;
      width: 175px;
      height: 175px;
      object-fit: contain;
      z-index: 5;
    }
    .bird {
      position: absolute;
      left: 718px;
      top: 1488px;
      width: 202px;
      height: 161px;
      object-fit: contain;
      z-index: 4;
    }
    .underline-title {
      position: absolute;
      left: 92px;
      top: 873px;
      width: 913px;
      height: 77px;
      object-fit: fill;
      z-index: 4;
    }
    .underline-location {
      position: absolute;
      left: 133px;
      top: 1578px;
      width: 398px;
      height: 28px;
      object-fit: fill;
      z-index: 4;
    }
    .photo-stage {
      position: absolute;
      left: 719px;
      top: 95px;
      width: 1783px;
      height: 2130px;
      transform: rotate(10.19deg);
      transform-origin: 50% 50%;
      z-index: 1;
    }
    .photo-stage .person {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% 18%;
      -webkit-mask-image: url("photo-mask.png");
      mask-image: url("photo-mask.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    .photo-stage .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .badge-author {
      position: absolute;
      left: 1559px;
      top: 234px;
      width: 602px;
      height: 390px;
      z-index: 6;
    }
    .badge-author img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .author-name {
      position: absolute;
      left: 155px;
      top: 83px;
      color: #fff;
      font-size: 96px;
      letter-spacing: 5.76px;
      text-transform: none;
      transform: rotate(-1.51deg);
      transform-origin: left center;
      white-space: nowrap;
    }
    .author-label {
      position: absolute;
      left: 149px;
      top: 213px;
      color: #fff;
      font-size: 48px;
      letter-spacing: 3.84px;
    }
    .badge-age {
      position: absolute;
      left: 934px;
      top: 1735px;
      width: 380px;
      height: 377px;
      z-index: 6;
    }
    .badge-age img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .age-value {
      position: absolute;
      left: 98px;
      top: 82px;
      color: #000;
      font-size: 130px;
      letter-spacing: 2.6px;
      transform: rotate(-8.24deg);
      transform-origin: center;
      white-space: nowrap;
    }
    .age-label {
      position: absolute;
      left: 142px;
      top: 230px;
      color: #000;
      font-size: 48px;
      letter-spacing: 0.96px;
      transform: rotate(-9.18deg);
      white-space: nowrap;
    }
    .badge-gender {
      position: absolute;
      left: 1314px;
      top: 1768px;
      width: 388px;
      height: 332px;
      z-index: 6;
    }
    .badge-gender img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .gender-icon {
      position: absolute;
      left: 163px;
      top: 72px;
      width: 76px;
      height: 110px;
    }
    .gender-label {
      position: absolute;
      left: 100px;
      top: 210px;
      color: #f9f8f9;
      font-size: 54px;
      letter-spacing: 1.08px;
      transform: rotate(-6.21deg);
      white-space: nowrap;
    }
    .badge-orientation {
      position: absolute;
      left: 1734px;
      top: 1768px;
      width: 393px;
      height: 312px;
      z-index: 6;
    }
    .badge-orientation img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hearts-icon {
      position: absolute;
      left: 141px;
      top: 45px;
      width: 119px;
      height: 119px;
    }
    .orientation-label {
      position: absolute;
      left: 84px;
      top: 178px;
      color: #f9f8f9;
      font-size: 54px;
      letter-spacing: 1.08px;
      transform: rotate(-6.76deg);
      white-space: nowrap;
    }
    .explicit {
      display: none;
    }
    .card.is-explicit .explicit {
      display: block;
    }
    .badge-explicit {
      position: absolute;
      left: 62px;
      top: 1697px;
      width: 558px;
      height: 313px;
      z-index: 6;
      filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.25));
    }
    .badge-explicit img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .explicit-label {
      position: absolute;
      left: 105px;
      top: 94px;
      color: #fff;
      font-size: 72px;
      letter-spacing: 7.2px;
      transform: rotate(6.84deg);
      white-space: nowrap;
    }
    .explicit-swoosh {
      position: absolute;
      left: 643px;
      top: 1707px;
      width: 90px;
      height: 98px;
      z-index: 6;
    }
  </style>
</head>
<body>
  <div class="card __EXPLICIT_CLASS__">
    <div class="photo-stage">
      <img class="person" src="__PHOTO_SRC__" alt="" />
      <img class="frame" src="photo-frame.png" alt="" />
    </div>

    <img class="ttl-logo" src="ttl-logo.png" alt="" />
    <img class="sun" src="sun.png" alt="" />
    <img class="bird" src="bird.png" alt="" />
    <img class="underline-title" src="underline-title.png" alt="" />
    <img class="underline-location" src="underline-location.png" alt="" />

    <div class="title-block">
      <div class="title font-edo">__TITLE__</div>
      <div class="subtitle font-edo">__SUBTITLE__</div>
    </div>
    <div class="description">__DESCRIPTION__</div>
    <div class="location">
      <img class="location-pin" src="location-pin.png" alt="" />
      <div class="location-text font-edo">__LOCATION__</div>
    </div>

    <div class="badge-author">
      <img class="bg" src="badge-author.png" alt="" />
      <div class="author-name font-edo">__AUTHOR_NAME__</div>
      <div class="author-label font-edo">author</div>
    </div>
    <div class="badge-age">
      <img class="bg" src="badge-age.png" alt="" />
      <div class="age-value font-edo">__AGE__</div>
      <div class="age-label font-edo">Age</div>
    </div>
    <div class="badge-gender">
      <img class="bg" src="badge-gender.png" alt="" />
      <img class="gender-icon" src="icon-female.svg" alt="" />
      <div class="gender-label font-edo">__GENDER__</div>
    </div>
    <div class="badge-orientation">
      <img class="bg" src="badge-orientation.png" alt="" />
      <img class="hearts-icon" src="icon-hearts.svg" alt="" />
      <div class="orientation-label font-edo">__ORIENTATION__</div>
    </div>

    <div class="explicit">
      <div class="badge-explicit">
        <img class="bg" src="badge-explicit.png" alt="" />
        <div class="explicit-label font-edo">explicit</div>
      </div>
      <img class="explicit-swoosh" src="explicit-swoosh.png" alt="" />
    </div>
  </div>
</body>
</html>
