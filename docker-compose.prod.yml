services:
  api:
    # Instead of "build: .", the server pulls the finished image from Docker Hub
    # Make sure to replace "your-dockerhub-username" with your actual username
    image: your-dockerhub-username/michielstokman-api:latest
    container_name: michielstokman-api-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
