[project]
name = "michielstokman-ai-part"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "boto3>=1.42.91",
    "fastapi>=0.135.2",
    "firebase-admin>=7.4.0",
    "google-auth>=2.49.2",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "passlib>=1.7.4",
    "pinecone>=6.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.48",
    "stripe>=15.0.1",
    "uvicorn[standard]>=0.42.0",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
