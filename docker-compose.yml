services:
  db:
    image: postgres:15-alpine
    container_name: michielstokman-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-michielstokman_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    image: tashinmahmud/michielstokman-api:latest
    container_name: michielstokman-api-prod
    # Chromium (cover-template Playwright) needs more than the default 64MB /dev/shm
    # or page.goto dies with TargetClosedError mid-asset load.
    shm_size: "256mb"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  media_data:
