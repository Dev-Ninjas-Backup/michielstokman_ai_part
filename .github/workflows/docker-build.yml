name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers immediately when you push code to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        # You will add your Docker Hub credentials into your GitHub Repo Settings -> Secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Change "your-dockerhub-username" in the dashboard later
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/michielstokman-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2
        # This step automatically logs into your EC2 server via SSH and tells it to pull the new update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/michielstokman-backend
            docker-compose pull
            docker-compose up -d

