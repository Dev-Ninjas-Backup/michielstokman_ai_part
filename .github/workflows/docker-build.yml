name: Build and Push Docker Image

on:
  push:
    branches:
      - main

# Lets GITHUB_TOKEN read this private repo so the EC2 deploy step can fetch it.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: self-hosted
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        # You will add your Docker Hub credentials into your GitHub Repo Settings -> Secrets
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Change "your-dockerhub-username" in the dashboard later
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/michielstokman-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2
        # This step automatically logs into your EC2 server via SSH and tells it to pull the new update
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Short-lived token, valid only for this workflow run. Preferred over a
          # long-lived PAT stored on the server.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,GH_REPOSITORY
          script: |
            set -e
            cd ~/michielstokman_ai_part

            # The server's origin remote is an unauthenticated HTTPS URL, and
            # GitHub answers anonymous requests for a private repo with
            # "Repository not found". Fetch with the run's token instead, passed
            # inline so no credentials are written to the server's git config.
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" main
            git reset --hard FETCH_HEAD

            docker compose pull
            docker compose up -d --force-recreate

