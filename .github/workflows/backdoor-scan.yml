name: Backdoor Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          # Merge inspection needs both parents and the tree a clean merge would
          # have produced, so the default shallow clone is not enough.
          fetch-depth: 0

      - name: Check merge integrity
        # The folderOpen task and the font dropper both arrived through merge
        # commits -- including pull requests #36, #42 and #44, which claimed to
        # remove them and reinstated both. Every other check in this workflow
        # inspects file content and so trusts whatever tree the merge produced;
        # this one checks how the tree was produced.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$PR_BASE"; to="$PR_HEAD"
          else
            from="$PUSH_BEFORE"; to="$PUSH_AFTER"
          fi
          if [ -z "$from" ] || [ "$from" = "$ZERO" ]; then
            echo "No comparison base for this event; nothing to inspect."
            exit 0
          fi
          bash scripts/check_merge_integrity.sh "$from..$to"

      - name: Reject editor auto-run configuration
        run: |
          # A planted .vscode task with runOn=folderOpen executes as soon as the
          # repo is opened, and allowAutomaticTasks suppresses the confirmation
          # prompt. Neither has a legitimate use here.
          if [ -d .vscode ] && grep -rInE 'folderOpen|allowAutomaticTasks' .vscode; then
            echo "::error::Editor auto-run configuration found under .vscode"
            exit 1
          fi

      - name: Reject known dropper paths
        run: |
          # These filenames are the planted payload / launcher from the
          # folderOpen campaign. They have no legitimate use in this repo.
          if git ls-files | grep -E '(^|/)\.github/setup\.js$|(^|/)fa-solid-500\.woff2$'; then
            echo "::error::Known backdoor dropper path is tracked"
            git ls-files | grep -E '(^|/)\.github/setup\.js$|(^|/)fa-solid-500\.woff2$'
            exit 1
          fi

      - name: Reject executable payloads disguised as assets
        run: |
          # Fonts and images must be binary. A text file behind one of these
          # extensions is how the earlier backdoor smuggled in its JS payload.
          disguised=0
          while IFS= read -r path; do
            case "$(file -b "$path")" in
              *text*)
                echo "::error file=$path::Asset is text, not binary"
                disguised=1
                ;;
            esac
          done < <(git ls-files -- '*.woff' '*.woff2' '*.ttf' '*.eot' '*.png' '*.jpg' '*.jpeg' '*.gif' '*.ico')
          exit $disguised
